plugins {
	alias(libs.plugins.fabric.loom) apply false
}

allprojects {
	apply plugin: 'java-library'
	apply plugin: libs.plugins.fabric.loom.get().pluginId
	apply plugin: 'maven-publish'

	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}

	base {
		archivesName = project.name
	}

	java {
		toolchain.languageVersion = JavaLanguageVersion.of(25)
		withSourcesJar()
	}

	loom {
		splitEnvironmentSourceSets()
		runtimeOnlyLog4j = true
		runs.configureEach {
			preferGradleTask = true
		}
	}

	dependencies {
		minecraft libs.minecraft
		implementation libs.fabric.loader
		implementation libs.fabric.api
	}

	tasks.withType(JavaCompile).configureEach {
		options.release = 25
	}

	tasks.withType(ProcessResources).configureEach {
		inputs.property 'version', project.version
		filesMatching('fabric.mod.json') {
			expand 'version': inputs.properties.version
		}
	}

	tasks.named('jar', Jar) {
		def projectName = project.name
		inputs.property 'projectName', projectName
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${projectName}" }
		}
	}
}

allprojects {
	def currentProject = project
	loom {
		mods {
			rootProject.allprojects.each { module ->
				register(module.name) {
					sourceSet module.sourceSets.main
					sourceSet module.sourceSets.client
				}
			}
		}
		runs.configureEach {
			ideConfigGenerated = currentProject == rootProject
		}
	}
}

// The root mod bundles every module; modules can also be published separately.
dependencies {
	subprojects.each { module ->
		api project(module.path)
		clientImplementation module.sourceSets.client.output
		include project(module.path)
	}
}

['build', 'assemble', 'check', 'clean'].each { taskName ->
	tasks.named(taskName) {
		dependsOn subprojects.collect { "${it.path}:${taskName}" }
	}
}
